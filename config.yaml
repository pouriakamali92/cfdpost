# Alle Parameter von cfdpost. Pfade relativ zu dieser Datei.
versions:                       # neue Version = ein Block mehr
  - {name: v1, file: data/v1.csv, label: Version1, color: red}
  - {name: v2, file: data/v2.csv, label: Version2, color: gold}
  - {name: v3, file: data/v3.csv, label: Version3, color: green}
  - {name: v4, file: data/v4.csv, label: Version4, color: blue}

columns:                        # Spaltennamen im Fluent-Export
  x: x-coordinate
  z: z-coordinate
  value: total-temperature

geometry:
  reference: v1                 # Version, aus der die Krümmer-Geometrie gefittet wird
  fit_bins: 60
  bend_mask: {x_min: -0.5, x_max: 0.15, z_min: 0.72, z_max: 1.05}   # Meter

wall:
  bins: {vertical: 40, bend: 60, horizontal: 40}

smoothing:
  window: 15

plot:
  figsize: [12, 8]
  linewidth: 2
  dpi: 200
  xlabel: Distance along outer wall S (m)
  ylabel: Temperature (K)
  title: gemittelte Temperatur auf der innenseite der Außenwand
  filename: gemittelte_Temperatur_smoothed.png

output:
  dir: outputs
